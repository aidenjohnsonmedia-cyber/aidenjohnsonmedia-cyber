<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aiden Johnson · World 1-1</title>
<meta name="description" content="A tiny playable platformer about Aiden Johnson, founder of HayWire. Hit the blocks.">
<style>
@font-face{font-family:'PS2P';src:url(ps2p.woff2) format('woff2')}
:root{--bg:#0d1117}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:'PS2P',monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.btn{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:64px;height:64px;border:4px solid #fff;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;pointer-events:auto;opacity:.75}
.btn:active{background:rgba(255,255,255,.35)}
#left{left:18px}#right{left:98px}#jump{right:18px;width:76px;height:76px;background:rgba(214,69,69,.75);border-color:#fff}
.nt .btn{display:none}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,17,23,.88);pointer-events:auto;padding:16px}
#overlay.show{display:flex}
.panel{width:min(420px,100%);background:#1a1a2e;border:4px solid #e7c45a;padding:20px;text-align:center}
.panel h1{font-size:16px;margin-bottom:14px;color:#fff;text-shadow:3px 3px #000}
.row{display:flex;justify-content:space-between;font-size:9px;margin:8px 0;opacity:0;animation:rv .3s steps(1) forwards}
.row b{color:#e7c45a;font-weight:normal}
@keyframes rv{to{opacity:1}}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.links a{display:block;padding:12px 6px;color:#fff;text-decoration:none;font-size:8px;border-bottom:4px solid rgba(0,0,0,.5)}
.again{margin-top:14px;font-size:8px;color:#7be37a;background:none;border:0;font-family:inherit;cursor:pointer}
.again:after{content:" ▶";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="320" height="180"></canvas></div>
<div id="ui">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="right">▶</div>
  <div class="btn" id="jump">A</div>
  <div id="overlay">
    <div class="panel">
      <h1>COURSE CLEAR!</h1>
      <div id="tally"></div>
      <div class="links">
        <a href="mailto:haywireagprices@gmail.com" style="background:#d64545">EMAIL</a>
        <a href="https://haywireag.com" style="background:#2f6fd6">HAYWIREAG.COM</a>
        <a href="https://x.com/aidenjohnsonn_" style="background:#1a1a2e;border:2px solid #fff">X / @aidenjohnsonn_</a>
        <a href="https://www.linkedin.com/in/YOUR-LINKEDIN-HANDLE" style="background:#0a66c2">LINKEDIN</a>
      </div>
      <button class="again" id="again">PLAY AGAIN</button>
    </div>
  </div>
</div>
<script src="sprites.js"></script>
<script>
(() => {
const W = 320, H = 180, T = 16, GY = 148;
const cv = document.getElementById('c'), cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

// ---- sprite cache
const PAL = SPRITES.PAL, img = {};
function spr(name, flip) {
  const key = name + (flip ? '_f' : '');
  if (img[key]) return img[key];
  const g = SPRITES.SPR[name], w = g[0].length, h = g.length;
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  const q = o.getContext('2d');
  g.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { q.fillStyle = PAL[ch]; q.fillRect(flip ? w - 1 - x : x, y, 1, 1); } }));
  return img[key] = o;
}
const SIZE = n => ({ w: SPRITES.SPR[n][0].length, h: SPRITES.SPR[n].length });

// ---- scaling
function fit() {
  const s = Math.min(6, Math.min(innerWidth / W, innerHeight / H));
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---- level
const FACTS = [
  ['WHO', 'Aiden Johnson. 20. Founder, builder, D3 hooper. Cannon Falls, Minnesota.'],
  ['HAYWIRE', 'Market intelligence for hay. No exchange, no futures, almost no price reporting. HayWire fixes that every week.'],
  ['THE NUMBERS', '750+ subscribers. 134+ regions. 125K+ price records. Weekly since Feb 2026.'],
  ['BONUS STAGE', 'Bloomberg Odd Lots, June 12 2026, with Joe Weisenthal and Tracy Alloway.'],
  ['WIRE INTEL', 'AI-powered defense capture intelligence. Private repo. In progress.'],
  ['POWER-UPS', 'Hay. Scaling. USDA data. Field network. Cron jobs. Cold email.'],
  ['WORLD MAP', 'Cannon Falls to Jamestown (D2) to UW-Stout (D3, Blue Devils, teammates with my brother).'],
  ['HOOPER', 'Runs a company between practices. No days off.'],
];
const LEVEL_W = 1900;
let solids, blocks, coins, decos, flagX, state, player, cam, score, timeLeft, sign, frame, keys;

function build() {
  solids = []; blocks = []; coins = []; decos = [];
  solids.push({ x: 0, y: GY, w: LEVEL_W, h: 40 });
  const bx = [120, 300, 460, 640, 820, 1000, 1200, 1420];
  bx.forEach((x, i) => { blocks.push({ x, y: 96, w: 16, h: 16, used: false, fact: FACTS[i], bump: 0 }); solids.push(blocks[i]); });
  // bricks beside some blocks
  [316, 332, 656, 1216, 1232].forEach(x => solids.push({ x, y: 96, w: 16, h: 16, brick: true }));
  // pipes
  [[380, 24], [720, 36], [1100, 24], [1560, 36]].forEach(([x, h]) => solids.push({ x, y: GY - h, w: 28, h, pipe: true }));
  // coins
  [200, 216, 232, 560, 576, 900, 916, 932, 1300, 1316, 1500, 1516, 1532].forEach(x => coins.push({ x, y: 112, got: false }));
  // decor
  [60, 540, 980, 1380, 1700].forEach(x => decos.push({ n: 'HAY_BALE', x, y: GY - 12 }));
  [260, 880, 1260, 1660].forEach(x => decos.push({ n: 'BUSH', x, y: GY - 6 }));
  flagX = 1800;
  solids.push({ x: flagX - 20, y: GY - 16, w: 16, h: 16, brick: true });
}
function reset() {
  build();
  player = { x: 40, y: GY - 24, w: 12, h: 24, vx: 0, vy: 0, dir: 1, ground: false };
  cam = 0; score = 0; timeLeft = 400; sign = null; frame = 0;
  keys = { l: false, r: false, j: false, jp: false };
  state = 'title';
  document.getElementById('overlay').classList.remove('show');
}

// ---- input
const kd = e => {
  if (state === 'title' && !e.repeat) { state = 'play'; return; }
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.l = true;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.r = true;
  if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) { if (!keys.j) keys.jp = true; keys.j = true; e.preventDefault(); }
};
const ku = e => {
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.l = false;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.r = false;
  if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) keys.j = false;
};
addEventListener('keydown', kd); addEventListener('keyup', ku);
function bindBtn(id, k) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); if (state === 'title') state = 'play'; if (k === 'j' && !keys.j) keys.jp = true; keys[k] = true; };
  const off = e => { e.preventDefault(); keys[k] = false; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindBtn('left', 'l'); bindBtn('right', 'r'); bindBtn('jump', 'j');
cv.addEventListener('pointerdown', () => { if (state === 'title') state = 'play'; });
if (!('ontouchstart' in window)) document.body.classList.add('nt');
document.getElementById('again').onclick = reset;

// ---- physics
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function step() {
  frame++;
  if (state !== 'play') return;
  if (frame % 60 === 0 && timeLeft > 0) timeLeft--;
  const p = player, acc = 0.18, max = 1.7;
  if (keys.l) { p.vx = Math.max(-max, p.vx - acc); p.dir = -1; }
  else if (keys.r) { p.vx = Math.min(max, p.vx + acc); p.dir = 1; }
  else p.vx *= 0.8;
  if (keys.jp && p.ground) { p.vy = -6.2; p.ground = false; }
  keys.jp = false;
  if (!keys.j && p.vy < -2) p.vy = -2; // short hop
  p.vy = Math.min(7, p.vy + 0.32);

  p.x += p.vx;
  for (const s of solids) if (overlap(p, s)) { if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w; p.vx = 0; }
  p.x = Math.max(0, Math.min(LEVEL_W - p.w, p.x));

  p.y += p.vy; p.ground = false;
  for (const s of solids) if (overlap(p, s)) {
    if (p.vy > 0) { p.y = s.y - p.h; p.vy = 0; p.ground = true; }
    else if (p.vy < 0) { p.y = s.y + s.h; p.vy = 0; if (s.fact && !s.used) hit(s); }
  }
  for (const c of coins) if (!c.got && overlap(p, { x: c.x, y: c.y, w: 8, h: 8 })) { c.got = true; score++; }
  if (p.x + p.w > flagX - 2) finish();
  if (sign && --sign.t <= 0) sign = null;
  for (const b of blocks) if (b.bump > 0) b.bump--;
  cam = Math.max(0, Math.min(LEVEL_W - W, p.x - W / 2 + 40));
}
function hit(b) { b.used = true; b.bump = 10; score += 5; sign = { title: b.fact[0], text: b.fact[1], t: 420 }; }
function finish() {
  state = 'clear';
  const rows = [['SUBSCRIBERS', '750+'], ['REGIONS', '134+'], ['PRICE RECORDS', '125K+'], ['COINS', String(score)], ['TIME BONUS', String(timeLeft * 10)]];
  document.getElementById('tally').innerHTML = rows.map((r, i) => `<div class="row" style="animation-delay:${.3 + i * .35}s"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  document.getElementById('overlay').classList.add('show');
}

// ---- drawing
function txt(s, x, y, size, col, align) {
  cx.font = size + 'px PS2P'; cx.fillStyle = col || '#fff'; cx.textAlign = align || 'left'; cx.textBaseline = 'top'; cx.fillText(s, x, y);
}
function wrap(s, max) { const out = []; let line = ''; for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > max) { out.push(line.trim()); line = w; } else line += ' ' + w; } if (line.trim()) out.push(line.trim()); return out; }
function draw() {
  const sky = cx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#4f9df5'); sky.addColorStop(1, '#a6dbff'); cx.fillStyle = sky; cx.fillRect(0, 0, W, H);
  // parallax clouds + hills
  const cs = spr('CLOUD');
  for (let i = 0; i < 6; i++) cx.drawImage(cs, ((i * 140 - cam * 0.3) % (W + 60) + W + 60) % (W + 60) - 30, 20 + (i % 3) * 18);
  for (let i = 0; i < 8; i++) { const hx = ((i * 260 - cam * 0.6) % (W + 200) + W + 200) % (W + 200) - 100, r = 50 + (i % 2) * 25; cx.fillStyle = '#1f5a2a'; cx.beginPath(); cx.arc(hx, GY, r, Math.PI, 0); cx.fill(); cx.fillStyle = '#3f9b47'; cx.beginPath(); cx.arc(hx, GY, r - 3, Math.PI, 0); cx.fill(); }
  cx.save(); cx.translate(-Math.floor(cam), 0);
  for (const d of decos) { const s = SIZE(d.n); cx.drawImage(spr(d.n), d.x, d.y - s.h); }
  // ground tiles
  const g = spr('GROUND');
  for (let x = Math.floor(cam / 16) * 16 - 16; x < cam + W + 16; x += 16) { cx.drawImage(g, x, GY); cx.fillStyle = '#5a2f18'; cx.fillRect(x, GY + 8, 16, 32); }
  for (const s of solids) {
    if (s.pipe) { cx.fillStyle = '#1a1a1a'; cx.fillRect(s.x - 3, s.y - 1, s.w + 6, 8); cx.fillRect(s.x - 1, s.y, s.w + 2, s.h); cx.fillStyle = '#2fa84f'; cx.fillRect(s.x, s.y, s.w, s.h); cx.fillStyle = '#7be37a'; cx.fillRect(s.x, s.y, 3, s.h); cx.fillStyle = '#1b6b2f'; cx.fillRect(s.x + s.w - 5, s.y, 5, s.h); cx.fillStyle = '#2fa84f'; cx.fillRect(s.x - 2, s.y, s.w + 4, 6); cx.fillStyle = '#1b6b2f'; cx.fillRect(s.x + s.w - 4, s.y, 6, 6); }
    else if (s.brick) cx.drawImage(spr('BRICK'), 0, 0, 16, 8, s.x, s.y, 16, 8), cx.drawImage(spr('BRICK'), 0, 0, 16, 8, s.x, s.y + 8, 16, 8);
    else if (s.fact) cx.drawImage(spr(s.used ? 'USED_BLOCK' : 'BLOCK'), s.x, s.y - (s.bump > 5 ? 4 : s.bump > 0 ? 2 : 0));
  }
  const coin = spr('COIN');
  for (const c of coins) if (!c.got) cx.drawImage(coin, c.x, c.y + Math.round(Math.sin(frame / 10 + c.x) * 2));
  // flag
  cx.fillStyle = '#8f8f8f'; cx.fillRect(flagX, GY - 96, 2, 96); cx.fillStyle = '#7be37a'; cx.fillRect(flagX - 2, GY - 100, 6, 6);
  cx.drawImage(spr('FLAG'), 0, 0, 8, 5, flagX + 2, GY - 92, 8, 5);
  const cs2 = SIZE('CASTLE'); cx.drawImage(spr('CASTLE'), flagX + 40, GY - cs2.h);
  // player
  const p = player, moving = Math.abs(p.vx) > 0.2 && p.ground;
  const pn = !p.ground ? 'PLAYER_B' : moving ? (Math.floor(frame / 6) % 2 ? 'PLAYER_A' : 'PLAYER_B') : 'PLAYER_STAND';
  cx.drawImage(spr(pn, p.dir < 0), Math.round(p.x) - 2, Math.round(p.y));
  cx.restore();
  // HUD
  txt('AIDEN', 8, 6, 8); txt('HAYWIRE', 8, 16, 8, '#e7c45a');
  cx.drawImage(coin, 110, 6); txt('x' + score, 122, 7, 8);
  txt('WORLD 1-1', 168, 6, 8); txt('TIME ' + timeLeft, 250, 6, 8);
  // sign
  if (sign) {
    const lines = wrap(sign.text, 36), h = 28 + lines.length * 10;
    cx.fillStyle = '#fff'; cx.fillRect(12, 30, W - 24, h); cx.fillStyle = '#1a1a2e'; cx.fillRect(14, 32, W - 28, h - 4); cx.fillStyle = '#fff'; cx.fillRect(16, 34, W - 32, h - 8);
    txt(sign.title, 22, 40, 8, '#d64545'); lines.forEach((l, i) => txt(l, 22, 52 + i * 10, 7, '#1a1a2e'));
  }
  if (state === 'title') {
    cx.fillStyle = 'rgba(13,17,23,.55)'; cx.fillRect(0, 0, W, H);
    txt('AIDEN JOHNSON', W / 2 + 2, 52, 16, '#1a1a2e', 'center'); txt('AIDEN JOHNSON', W / 2, 50, 16, '#fff', 'center');
    txt('FOUNDER / BUILDER / HOOPER', W / 2, 76, 7, '#e7c45a', 'center');
    txt('HIT THE BLOCKS. REACH THE FLAG.', W / 2, 96, 6, '#fff', 'center');
    if (Math.floor(frame / 30) % 2) txt('PRESS START', W / 2, 124, 9, '#fff', 'center');
    txt(('ontouchstart' in window) ? 'buttons below · A to jump' : 'arrows to move · space to jump', W / 2, 150, 6, '#cfe6ff', 'center');
  }
}
function loop() { step(); draw(); requestAnimationFrame(loop); }
document.fonts.load('8px PS2P').then(() => { reset(); loop(); });
})();
</script>
</body>
</html>
